<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Friendship Day ❤️</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:linear-gradient(135deg,#1e3c72,#2a5298);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial,sans-serif;
}

.card{
    text-align:center;
    background:white;
    padding:40px;
    border-radius:20px;
    box-shadow:0 0 30px rgba(255,255,255,.3);
    transform:scale(0);
    animation:pop 1s forwards;
}

h1{
    color:#ff4081;
}

p{
    color:#444;
    font-size:18px;
}

button{
    padding:12px 25px;
    border:none;
    border-radius:30px;
    background:#ff4081;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#e91e63;
}

.heart{
    position:absolute;
    color:#ff4d6d;
    font-size:25px;
    animation:float 5s linear infinite;
}

@keyframes float{
    from{
        transform:translateY(100vh);
        opacity:1;
    }
    to{
        transform:translateY(-120vh);
        opacity:0;
    }
}

@keyframes pop{
    to{
        transform:scale(1);
    }
}
</style>

</head>
<body>

<button id="open">🎁 Open Your Surprise</button>

<div class="card" id="card" style="display:none;">
<h1>💖 Happy Friendship Day 💖</h1>

<p>
Some friends become family.<br><br>

Thank you for every laugh,<br>
every memory,<br>
and every smile.<br><br>

I'm lucky to have you in my life. ❤️
</p>

<h3>— From Vaishu 🌸</h3>

</div>

<script>

const btn=document.getElementById("open");
const card=document.getElementById("card");

btn.onclick=function(){

btn.style.display="none";
card.style.display="block";

for(let i=0;i<60;i++){

let h=document.createElement("div");
h.innerHTML="❤️";
h.className="heart";

h.style.left=Math.random()*100+"vw";
h.style.animationDuration=(3+Math.random()*3)+"s";
h.style.fontSize=(20+Math.random()*20)+"px";

document.body.appendChild(h);

setTimeout(()=>h.remove(),6000);

}

}

</script>

</body>
</html>
